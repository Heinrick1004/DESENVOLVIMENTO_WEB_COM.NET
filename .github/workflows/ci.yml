name: Validar e empacotar Portal de Tarefas

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SQL_IMAGE: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
      API_URL: http://127.0.0.1:5240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: src/PortalTarefas.Frontend/package-lock.json
      - name: Restaurar .NET
        run: dotnet restore PortalTarefas.sln
      - name: Compilar .NET
        run: dotnet build PortalTarefas.sln -c Release --no-restore
      - name: Preparar credencial efêmera e banco exclusivo
        shell: bash
        run: |
          password="aA1!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          connection="Server=127.0.0.1,14333;Database=PortalTarefas_Tests_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT};User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True"
          echo "::add-mask::$connection"
          printf 'MSSQL_SA_PASSWORD=%s\nPORTAL_TEST_CONNECTION=%s\nConnectionStrings__PortalTarefas=%s\n' "$password" "$connection" "$connection" >> "$GITHUB_ENV"
      - name: Iniciar SQL Server isolado para esta execução
        shell: bash
        run: |
          docker run --detach --name portal-ci-sql --memory 3g \
            --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_MEMORY_LIMIT_MB=2048 --env MSSQL_SA_PASSWORD \
            "$SQL_IMAGE"
      - name: Aguardar SQL Server antes das migrations
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" docker exec --env SQLCMDPASSWORD portal-ci-sql \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 2 -Q 'SELECT 1' -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server não ficou disponível no prazo.' >&2
          exit 1
      - name: Aplicar migrations e executar testes sem ignorados
        shell: pwsh
        run: ./scripts/Test-Integration.ps1 -Configuration Release -NoBuild -Initialize
      - name: Restaurar frontend
        working-directory: src/PortalTarefas.Frontend
        run: npm ci
      - name: Bloquear dependencias com vulnerabilidades altas ou criticas
        working-directory: src/PortalTarefas.Frontend
        run: npm audit --audit-level=high
      - name: Iniciar API real para conferir o contrato
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5240
          Portal__Storage: SqlServer
          Seed__Enabled: 'false'
          Telemetry__Console: 'false'
        run: |
          mkdir -p artifacts
          dotnet run --project src/PortalTarefas.Web/PortalTarefas.Web.csproj -c Release --no-build --no-launch-profile > artifacts/api-ci.log 2>&1 &
          echo "$!" > artifacts/api-ci.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$API_URL/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'A API não ficou pronta para a validação do contrato.' >&2
          exit 1
      - name: Gerar cliente a partir do OpenAPI servido pela API
        shell: pwsh
        run: ./scripts/Generate-Client.ps1 -ApiUrl $env:API_URL
      - name: Impedir divergência do contrato versionado
        run: git diff --exit-code -- docs/openapi.json src/PortalTarefas.Frontend/src/api/schema.d.ts
      - name: Executar chamada real com o cliente TypeScript
        working-directory: src/PortalTarefas.Frontend
        run: npm run verify:client
      - name: Testar frontend
        working-directory: src/PortalTarefas.Frontend
        run: npm test
      - name: Verificar tipos TypeScript
        working-directory: src/PortalTarefas.Frontend
        run: npm run typecheck
      - name: Compilar frontend
        working-directory: src/PortalTarefas.Frontend
        run: npm run build
      - name: Validar sintaxe e ordem dos bloqueios do pipeline
        run: |
          mkdir -p artifacts
          node scripts/Validate-CiStatic.mjs
          cp docs/evidencias/ci-validacao-estatica.json artifacts/ci-validacao-estatica.json
      - name: Inventariar dependências e versão
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet list src/PortalTarefas.Web/PortalTarefas.Web.csproj package --include-transitive --format json > artifacts/dependencias-dotnet.json
          if ($LASTEXITCODE -ne 0) { throw 'Inventário .NET falhou.' }
          Push-Location src/PortalTarefas.Frontend
          try {
            npm ls --all --json > ../../artifacts/dependencias-npm.json
            if ($LASTEXITCODE -ne 0) { throw 'Inventário npm falhou.' }
          } finally { Pop-Location }
          '${{ github.sha }}' | Set-Content artifacts/commit.txt
      - name: Publicar aplicação em pasta
        run: |
          dotnet publish src/PortalTarefas.Web/PortalTarefas.Web.csproj -c Release --no-restore -o artifacts/publish /p:InformationalVersion=${{ github.sha }} /p:IncludeSourceRevisionInInformationalVersion=false
          mkdir -p artifacts/publish/wwwroot/app
          cp -a src/PortalTarefas.Frontend/dist/. artifacts/publish/wwwroot/app/
      - name: Criar imagem identificada pelo commit
        run: |
          docker build --build-arg BUILD_VERSION=${{ github.sha }} -t portaltarefas:${{ github.sha }} .
          docker image inspect portaltarefas:${{ github.sha }} > artifacts/imagem.json
      - name: Gerar certificado HTTPS efêmero com Actions Secret
        shell: bash
        env:
          PORTAL_CI_CERTIFICATE_PASSWORD: ${{ secrets.PORTAL_CI_CERTIFICATE_PASSWORD }}
        run: |
          # Sem fallback: variável gerada no runner não comprova secret store.
          if [ "${#PORTAL_CI_CERTIFICATE_PASSWORD}" -lt 16 ]; then
            echo 'Configure o Actions Secret PORTAL_CI_CERTIFICATE_PASSWORD com ao menos 16 caracteres.' >&2
            exit 1
          fi
          if [[ "$PORTAL_CI_CERTIFICATE_PASSWORD" == *$'\n'* || "$PORTAL_CI_CERTIFICATE_PASSWORD" == *$'\r'* ]]; then
            echo 'O Actions Secret deve conter uma única linha.' >&2
            exit 1
          fi
          certificate_password="$PORTAL_CI_CERTIFICATE_PASSWORD"
          echo "::add-mask::$certificate_password"
          printf 'ASPNETCORE_Kestrel__Certificates__Default__Password=%s\n' "$certificate_password" >> "$GITHUB_ENV"
          dotnet dev-certs https --export-path "$RUNNER_TEMP/portal-ci.pfx" --password "$certificate_password"
          # O PFX é criptografado; o usuário não privilegiado precisa lê-lo.
          chmod 644 "$RUNNER_TEMP/portal-ci.pfx"
      - name: Executar a imagem real com SQL Server e HTTPS
        shell: bash
        run: |
          docker run --detach --name portal-ci-web --network host \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Portal__Storage=SqlServer --env Portal__FrontendOrigin=https://localhost:8443 \
            --env Seed__Enabled=false --env Telemetry__Console=false \
            --env ConnectionStrings__PortalTarefas \
            --env ASPNETCORE_Kestrel__Certificates__Default__Password \
            --env ASPNETCORE_Kestrel__Certificates__Default__Path=/https/portal.pfx \
            --mount "type=bind,source=$RUNNER_TEMP/portal-ci.pfx,target=/https/portal.pfx,readonly" \
            portaltarefas:${{ github.sha }}
          runtime_uid=$(docker exec portal-ci-web id -u)
          if [ "$runtime_uid" = 0 ]; then
            echo 'A imagem não deve executar como root.' >&2
            exit 1
          fi
          printf 'uid=%s\n' "$runtime_uid" > artifacts/container-user.txt
      - name: Validar Health Checks, MVC, SPA e versão da imagem
        shell: pwsh
        run: |
          $smoke = ./scripts/Smoke-Test.ps1 -BaseUrl https://localhost:8443 -VersaoEsperada $env:GITHUB_SHA -IgnorarCertificadoLocal -Tentativas 30
          $smoke | ConvertTo-Json -Depth 4 | Set-Content artifacts/smoke-container.json -Encoding UTF8
      - name: Confirmar Health Check nativo do contêiner
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            health=$(docker inspect --format '{{.State.Health.Status}}' portal-ci-web)
            if [ "$health" = healthy ]; then
              image_id=$(docker inspect --format '{{.Image}}' portal-ci-web)
              printf '{"commit":"%s","container":"portal-ci-web","imageId":"%s","health":"%s"}\n' "$GITHUB_SHA" "$image_id" "$health" > artifacts/container-health.json
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              echo 'O Health Check nativo do contêiner reprovou.' >&2
              exit 1
            fi
            sleep 2
          done
          echo 'O contêiner não atingiu o estado healthy no prazo.' >&2
          exit 1
      - name: Salvar imagem somente após o smoke test aprovado
        run: |
          docker save -o artifacts/portaltarefas-${{ github.sha }}.tar portaltarefas:${{ github.sha }}
      - name: Preservar artefatos após testes e smoke aprovados
        uses: actions/upload-artifact@v4
        with:
          name: portaltarefas-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Capturar logs do contêiner após falha
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          if docker container inspect portal-ci-web > /dev/null 2>&1; then
            docker logs portal-ci-web > artifacts/container-ci.log 2>&1
          fi
      - name: Preservar diagnóstico de testes que falharam
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-${{ github.sha }}
          path: |
            artifacts/tests/
            artifacts/api-ci.log
            artifacts/container-ci.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Encerrar somente os recursos efêmeros deste job
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/api-ci.pid ]; then
            kill "$(cat artifacts/api-ci.pid)" 2>/dev/null || true
          fi
          for container in portal-ci-web portal-ci-sql; do
            if docker container inspect "$container" > /dev/null 2>&1; then
              docker stop "$container" > /dev/null
              docker rm "$container" > /dev/null
            fi
          done
          if [ -f "$RUNNER_TEMP/portal-ci.pfx" ]; then
            rm -- "$RUNNER_TEMP/portal-ci.pfx"
          fi
