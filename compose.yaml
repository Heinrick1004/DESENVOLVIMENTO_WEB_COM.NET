# Outro projeto pode ser selecionado explicitamente para preservar volumes locais anteriores.
name: ${PORTAL_COMPOSE_PROJECT:-portal-tarefas-tests}
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD fora do repositorio}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -Q "SELECT 1" -C -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  web:
    image: portaltarefas:${PORTAL_IMAGE_TAG:-local}
    build:
      context: .
      args:
        BUILD_VERSION: ${PORTAL_IMAGE_TAG:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Portal__Storage: SqlServer
      Portal__FrontendOrigin: https://localhost:8443
      AllowedHosts: localhost;127.0.0.1
      ConnectionStrings__PortalTarefas: ${PORTAL_SQL_CONNECTION:?Defina a conexao externa de um banco PortalTarefas_Tests_ exclusivo}
      Seed__Enabled: "false"
      Seed__AdminEmail: ${PORTAL_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${PORTAL_ADMIN_PASSWORD:-}
      Seed__AdminEquipe: ${PORTAL_ADMIN_EQUIPE:-Geral}
      Seed__UserEmail: ${PORTAL_USER_EMAIL:-}
      Seed__UserPassword: ${PORTAL_USER_PASSWORD:-}
      Seed__UserEquipe: ${PORTAL_USER_EQUIPE:-Geral}
      Seed__SampleData: ${PORTAL_SEED_SAMPLE_DATA:-false}
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/portal.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${PORTAL_HTTPS_CERTIFICATE_PASSWORD:?Defina a senha externa do certificado}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ${PORTAL_HTTPS_CERTIFICATE_PATH:?Defina o caminho absoluto do certificado PFX}
        target: /https/portal.pfx
        read_only: true
      - protection-keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      # Ignora apenas a cadeia do certificado local no probe sem credenciais.
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8443/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  sql-data:
  protection-keys:
